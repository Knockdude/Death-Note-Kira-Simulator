let addedCounter=1;
let isGameOver=false;

function generateNewCriminals(count){
    if(isGameOver) return;

    for(let i=0;i<count;i++){

        const randomFirst=firstNames[Math.floor(Math.random()*firstNames.length)];
        const randomLast=lastNames[Math.floor(Math.random()*lastNames.length)];

        const name=`${randomFirst} ${randomLast}`;
        const crime=crimesList[Math.floor(Math.random()*crimesList.length)];
        const danger=Math.floor(Math.random()*51)+45;

        const exists = criminals.some(c => c.name === name);
        const finalName = exists ? `${name} (${addedCounter++})` : name;

        criminals.push({name: finalName, crime, danger});

    }

    searchCriminals();
    showShinigami("Aparecieron 10 nuevos criminales en las noticias de Japón...");

}

function updateHUD(){

    deathCount.textContent=deaths;

    let wanted=
        Math.min(100,(deaths/92)*100);

    wantedLevel.textContent=
        Math.round(wanted)+"%";

    wantedBar.style.width=
        wanted+"%";


    suspicion=
        Math.min(100,suspicion);

    suspicionText.textContent=
        Math.round(suspicion)+"%";

    suspicionBar.style.width=
        suspicion+"%";


    if(deaths>=92 || (wanted >= 100 && suspicion >= 100)){

        document.body.classList.add("danger");

    }else{

        document.body.classList.remove("danger");

    }

    localStorage.setItem(
        "dn_deaths",
        deaths
    );

    localStorage.setItem(
        "dn_suspicion",
        suspicion
    );

    if(wanted >= 100 && suspicion >= 100 && !isGameOver){
        triggerGameOver();
    }

}

function askRyukAdvice(){
    if(isGameOver) return;
    const randomTip = ryukTips[Math.floor(Math.random() * ryukTips.length)];
    showShinigami("Idea de Ryuk: " + randomTip);
}

function resetGame(){
    deaths = 0;
    suspicion = 0;
    isGameOver = false;
    target = null;
    addedCounter = 1;

    localStorage.removeItem("dn_deaths");
    localStorage.removeItem("dn_suspicion");

    criminals = JSON.parse(JSON.stringify(initialCriminals));

    nameInput.disabled = false;
    causeInput.disabled = false;
    searchInput.disabled = false;
    document.getElementById("writeBtn").disabled = false;

    nameInput.value = "";
    causeInput.value = "";
    searchInput.value = "";
    historyList.innerHTML = "";

    targetBox.innerHTML = `
        <div class="criminal-info">
            NINGÚN OBJETIVO SELECCIONADO
        </div>
    `;

    document.body.classList.remove("danger");

    updateHUD();
    searchCriminals();

    showAlert("🍎", "Un nuevo Death Note ha caído al mundo humano...", 2500);
    showShinigami("Kukuku... un nuevo comienzo. Veamos qué haces esta vez.");
}



function searchCriminals(){

    const query=
        searchInput.value
        .toLowerCase()
        .trim();

    const results=
        criminals.filter(c=>
            c.name
            .toLowerCase()
            .includes(query)
        );

    criminalList.innerHTML="";

    results.forEach(c=>{

        const div=
            document.createElement("div");

        div.className="criminal";

        div.innerHTML=`

            <div class="criminal-name">
                ${c.name}
            </div>

            <div class="criminal-info">
                ${c.crime}
                · Peligrosidad ${c.danger}%
            </div>

        `;

        div.onclick=()=>selectTarget(c);

        criminalList.appendChild(div);

    });

}



function selectTarget(c){
    if(isGameOver) return;

    target=c;

    nameInput.value=c.name;

    targetBox.innerHTML=`

        <div class="target-name">
            ${c.name}
        </div>

        <div class="criminal-info">
            ${c.crime}
        </div>

        <div class="criminal-info">
            Nivel de peligrosidad:
            ${c.danger}%
        </div>

    `;

}



function randomTarget(){
    if(isGameOver) return;

    if(criminals.length===0){

        showAlert(
            "📓",
            "No quedan objetivos disponibles.",
            2200
        );

        return;

    }

    const c=
        criminals[
            Math.floor(
                Math.random()*criminals.length
            )
        ];

    selectTarget(c);

}



function removeCriminal(name){

    const index=
        criminals.findIndex(c=>
            c.name.toLowerCase()===
            name.toLowerCase()
        );

    if(index!==-1){

        criminals.splice(index,1);

        if(
            target &&
            target.name.toLowerCase()===
            name.toLowerCase()
        ){

            target=null;

            targetBox.innerHTML=`

                <div class="criminal-info">
                    NINGÚN OBJETIVO SELECCIONADO
                </div>

            `;

        }

        searchCriminals();

    }

}



function writeName(){
    if(isGameOver) return;

    const name=
        nameInput.value.trim();

    const cause=
        causeInput.value.trim();


    if(!name){

        showAlert(
            "⚠",
            "Debes escribir un nombre.",
            1800
        );

        return;

    }


    let cautious=false;

    if(deaths>=92){

        cautious=true;

        suspicion+=
            cause ?
            2 :
            5;

    }

    else{

        suspicion+=
            cause ?
            1 :
            2;

    }


    deaths++;


    const finalCause=
        cause ||
        "Paro cardíaco";


    addHistory(
        name,
        finalCause
    );



    removeCriminal(name);


    causeInput.value="";

    nameInput.value="";


    if(cautious){

        showAlert(
            "👁",
            "Has escrito demasiados nombres.<br><br>"+
            "La investigación sobre Kira se está intensificando.<br><br>"+
            "<b>DEBES SER MÁS CAUTELOSO.</b>",
            3200
        );

    }

    else{

        showAlert(
            "☠",
            "<b>"+name+"</b><br><br>"+
            "Causa:<br>"+
            finalCause,
            2300
        );

    }


    randomEvent();

    updateHUD();

    checkDanger();


}



function addHistory(name,cause){

    const div=
        document.createElement("div");

    div.className=
        "history-entry";

    div.innerHTML=
        "<b>"+name+"</b><br>"+
        "<span style='color:#666'>"+
        cause+
        "</span>";

    historyList.prepend(div);

}



function showAlert(symbol,text,time){

    alertSymbol.innerHTML=symbol;

    alertText.innerHTML=text;

    alertBox.classList.add("show");

    setTimeout(()=>{

        alertBox.classList.remove("show");

    },time);

}



function randomEvent(){

    const chance=
        Math.random();

    if(chance<.18){

        setTimeout(()=>{

            showShinigami(
                "Mmm... cada vez escribes más nombres. "+
                "Esto se está poniendo interesante."
            );

        },1200);

    }

    else if(chance<.30){

        setTimeout(()=>{

            showShinigami(
                "Los investigadores están empezando "+
                "a notar un patrón..."
            );

        },1200);

        suspicion+=4;

    }

    else if(chance<.38){

        setTimeout(()=>{

            showShinigami(
                "Jejeje... ¿estás seguro de que "+
                "nadie puede relacionarte con Kira?"
            );

        },1200);

        suspicion+=6;

    }

    else if(suspicion > 60 && chance < .55){

        setTimeout(()=>{

            const tip = ryukTips[Math.floor(Math.random() * ryukTips.length)];

            showShinigami(
                "Oye Kira, la policía se acerca... " + tip
            );

        },1200);

    }

}



function showShinigami(text){

    shinigamiText.textContent=text;

    shinigami.classList.add("show");

    setTimeout(()=>{

        shinigami.classList.remove("show");

    },5000);

}



function checkDanger(){

    if(deaths===92){

        showAlert(
            "🚨",
            "<b>NIVEL CRÍTICO</b><br><br>"+
            "Has escrito 92 nombres.<br><br>"+
            "La investigación de Kira ha alcanzado "+
            "un punto extremadamente peligroso.",
            5000
        );

        showShinigami(
            "A partir de ahora tendrás que pensar "+
            "mucho más antes de escribir..."
        );

    }

}

function triggerGameOver(){
    isGameOver = true;
    
    nameInput.disabled = true;
    causeInput.disabled = true;
    searchInput.disabled = true;
    document.getElementById("writeBtn").disabled = true;

    showShinigami("Kukuku... Se acabó el tiempo, Kira. El nivel de búsqueda y la sospecha llegaron al máximo.");

    setTimeout(()=>{
        showAlert(
            "🍎",
            "<b>RYUK HA TOMADO EL CONTROL</b><br><br>"+
            "<i>'Fue divertido mientras duró, pero la policía te ha acorralado.'</i><br><br>"+
            "Ryuk te obliga a tomar la pluma...",
            4000
        );
    }, 2000);

    setTimeout(()=>{
        nameInput.value = "TU PROPIO NOMBRE";
        causeInput.value = "Paro cardíaco por acorralamiento de la policía.";
        
        showAlert(
            "☠",
            "<b>GAME OVER</b><br><br>"+
            "Has escrito tu propio nombre en la Death Note.<br><br>"+
            "<i>Causa: Paro cardíaco</i>",
            10000
        );

        addHistory("TU PROPIO NOMBRE", "Paro cardíaco (Game Over)");
    }, 6500);
}



searchInput.addEventListener(
    "keydown",
    e=>{

        if(e.key==="Enter")
            searchCriminals();

    }
);



searchCriminals();

updateHUD();

 

document.addEventListener(
    "keydown",
    e=>{

        if(e.key==="Escape"){

            showShinigami(
                "No puedes escapar del Death Note..."
            );

        }

    }
);

</script>
